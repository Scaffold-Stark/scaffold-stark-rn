name: EAS Submit

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to submit"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android
      profile:
        description: "Submit profile"
        required: true
        default: "production"
        type: choice
        options:
          - production

concurrency:
  group: eas-submit
  cancel-in-progress: false

jobs:
  submit:
    name: Submit to Stores
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .

      - name: Submit to stores
        run: eas submit --platform "$INPUT_PLATFORM" --profile "$INPUT_PROFILE" --non-interactive --latest
        env:
          INPUT_PLATFORM: ${{ github.event.inputs.platform }}
          INPUT_PROFILE: ${{ github.event.inputs.profile }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
