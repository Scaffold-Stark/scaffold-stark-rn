name: Publish create-stark-rn to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0). Leave empty to use version from package.json."
        required: false
        type: string
      dry_run:
        description: "Dry run (skip actual publish)"
        required: false
        default: false
        type: boolean

concurrency:
  group: npm-publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/create-stark-rn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync template from main rn app
        run: |
          echo "Syncing packages/create-stark-rn/template/rn with run-time app rn/"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "cwd=$(pwd)"
          rm -rf template/rn/*
          rsync -a --delete --exclude='node_modules' --exclude='.git' --exclude='**/build' --exclude='**/dist' "$GITHUB_WORKSPACE/packages/rn/" template/rn/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Build CLI
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Set create-stark-rn version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using manual version from workflow input: $VERSION"
          else
            VERSION=$(node -pe "require('../../package.json').version")
            echo "Using scaffold-stark-rn version from root package.json: $VERSION"
          fi
          npm version "$VERSION" --no-git-tag-version

      - name: Verify package
        run: npm pack --dry-run

      - name: Publish to npm
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run publish
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: npm publish --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
