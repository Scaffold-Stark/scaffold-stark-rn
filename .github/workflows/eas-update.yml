name: EAS Update (OTA)

on:
  push:
    branches:
      - main
    paths:
      - "packages/rn/**"
      - ".github/workflows/eas-update.yml"
      - "!packages/rn/eas.json"
      - "!packages/rn/**/*.md"
      - "!packages/rn/store-assets/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Update branch"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
      message:
        description: "Update message"
        required: false
        type: string

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: EAS OTA Update
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rn
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .

      - name: Determine update branch
        id: branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ github.event.inputs.branch }}
          INPUT_MESSAGE: ${{ github.event.inputs.message }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "branch=$INPUT_BRANCH" >> "$GITHUB_OUTPUT"
            if [ -z "$INPUT_MESSAGE" ]; then
              echo "message=Manual OTA update for $INPUT_BRANCH" >> "$GITHUB_OUTPUT"
            else
              echo "message=$INPUT_MESSAGE" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "branch=production" >> "$GITHUB_OUTPUT"
            echo "message=OTA update from commit $COMMIT_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish OTA update
        run: eas update --branch ${{ steps.branch.outputs.branch }} --message "${{ steps.branch.outputs.message }}" --non-interactive
